apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-interview-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "ai-interview-service"
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
spec:
  tls:
  - hosts:
    - interview.yourdomain.com
    secretName: ai-interview-tls
  rules:
  - host: interview.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-interview-service
            port:
              number: 80
