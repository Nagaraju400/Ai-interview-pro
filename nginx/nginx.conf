worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Log Format with Upstream Node tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstream Cluster Load Balancer (Least-Connections Algorithm)
    upstream nextjs_cluster {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Nginx Load Balancer Server Block
    server {
        listen 80;
        server_name localhost;

        # Load Balancer Health Check Endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK - Nginx Load Balancer Active';
        }

        # Reverse Proxy to Next.js App Replicas with WebSocket & Header Support
        location / {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;

            # Header Forwarding for Client Real IP, Host, and Security
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
